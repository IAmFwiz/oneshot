<title>The Carry Ladder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Layout: a range logbook in eight views. Sticky header with sync state and progress; photo-banded tiers on a ladder; cards for classes, a month-grouped calendar, drill logs with sparklines, and a budget ledger. */
:root{
  --bg:#E7E9E3;
  --surface:#F6F7F3;
  --surface-2:#DCE0D6;
  --ink:#151915;
  --muted:#596158;
  --line:#CBD1C5;
  --olive:#46582A;
  --olive-soft:#D9E1CA;
  --on-olive:#FFFFFF;
  --signal:#C94E1B;
  --signal-soft:#F5DCCF;
  --ok:#2A7548; --ok-soft:#D7EBDD;
  --warn:#8E5B00; --warn-soft:#F3E5C6;
  --no:#A82920; --no-soft:#F4D9D5;
  --photo-ink:#FFFFFF;
  --photo-dim:rgba(255,255,255,.78);
  --shade:rgba(10,13,10,.08);
  --f-display:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D100D; --surface:#151915; --surface-2:#1D221C; --ink:#E4E8E0; --muted:#97A095; --line:#2A3029;
    --olive:#A8C172; --olive-soft:#222B17; --on-olive:#10140B; --signal:#FF7C42; --signal-soft:#3A1D10;
    --ok:#62C48C; --ok-soft:#14301F; --warn:#E0AC48; --warn-soft:#33270F; --no:#F07A6E; --no-soft:#3A1A17;
    --shade:rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D100D; --surface:#151915; --surface-2:#1D221C; --ink:#E4E8E0; --muted:#97A095; --line:#2A3029;
  --olive:#A8C172; --olive-soft:#222B17; --on-olive:#10140B; --signal:#FF7C42; --signal-soft:#3A1D10;
  --ok:#62C48C; --ok-soft:#14301F; --warn:#E0AC48; --warn-soft:#33270F; --no:#F07A6E; --no-soft:#3A1A17;
  --shade:rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:120px}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:var(--olive);text-underline-offset:2px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:6px}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:saturate(1.3) blur(12px);-webkit-backdrop-filter:saturate(1.3) blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:10px 0;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mark{display:flex;align-items:center;gap:10px;min-width:0}
.rungs{width:22px;height:26px;flex:none;color:var(--olive)}
.wordmark{font-family:var(--f-display);font-weight:800;font-size:25px;letter-spacing:.02em;line-height:1;text-transform:uppercase;white-space:nowrap}
.hstat{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.hstat b{color:var(--ink)}
.sync{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:99px;background:var(--surface-2);font-size:11px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.cloud i{background:var(--ok)}
.sync.saving i{background:var(--warn)}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;text-decoration:none;color:var(--muted);font-weight:600;font-size:13.5px;padding:8px 10px 10px;border-bottom:2.5px solid transparent;white-space:nowrap}
.nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--signal)}
.nav a:hover{color:var(--ink)}

main .wrap{padding-block:22px 64px}
.view{display:flex;flex-direction:column;gap:18px}
h2.sec{font-family:var(--f-display);font-weight:800;font-size:27px;line-height:1.05;text-transform:uppercase;letter-spacing:.01em;margin:10px 0 -6px;text-wrap:balance}
.lead{font-size:16px;max-width:66ch;margin:0}
.eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mini{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* Hero */
.hero{position:relative;border-radius:18px;overflow:hidden;background:#20241c;min-height:300px;display:flex;align-items:flex-end}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 60%}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,10,8,.05) 0%,rgba(8,10,8,.25) 40%,rgba(8,10,8,.86) 100%)}
.hero-in{position:relative;z-index:1;padding:28px 22px 22px;display:flex;flex-direction:column;gap:8px;color:var(--photo-ink);max-width:720px}
.hero .eyebrow{color:var(--photo-dim)}
.hero h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(38px,7vw,64px);line-height:.92;text-transform:uppercase;letter-spacing:.005em;text-wrap:balance}
.hero p{margin:0;color:var(--photo-dim);font-size:15.5px;max-width:58ch}

/* Stat strip */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stat{background:var(--surface);padding:12px 14px;min-width:0;display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.05;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat .v.sm{font-size:19px;line-height:1.15;padding-top:4px}
.stat .s{font-size:12px;color:var(--muted)}
@media (max-width:700px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Ladder graphic */
.ladder{display:flex;flex-direction:column;gap:6px}
.rung{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;text-decoration:none;color:inherit}
.rung:hover{border-color:color-mix(in srgb,var(--olive) 45%,var(--line))}
.rung .n{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;color:var(--muted);text-align:center}
.rung.cur{border-color:var(--signal);box-shadow:0 0 0 1px var(--signal) inset}
.rung.cur .n{color:var(--signal)}
.rung.done .n{color:var(--olive)}
.rung .t{font-family:var(--f-display);font-weight:700;font-size:20px;text-transform:uppercase;line-height:1.05}
.rung .w{font-size:12.5px;color:var(--muted)}
.meter{height:6px;background:var(--surface-2);border-radius:6px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;width:0;background:var(--olive);border-radius:6px;transition:width .4s ease}
.rung .pct{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;min-width:48px}

/* Next moves */
.moves{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:760px){.moves{grid-template-columns:1fr}}
.move{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.move .k{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--signal)}
.move .h{font-weight:700;font-size:15px;line-height:1.3}
.move .b{font-size:13.5px;color:var(--muted)}
.move button{align-self:flex-start}

.callout{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.callout.hot{border-color:color-mix(in srgb,var(--signal) 45%,var(--line))}
.callout.hot .eyebrow{color:var(--signal)}
.callout p{margin:0;max-width:70ch}

/* Gantt */
.gantt-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 4px 8px 12px;overflow-x:auto}
.gantt-box svg{display:block;min-width:720px;width:100%;height:auto}
.gantt-box text{font-family:var(--f-mono);fill:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);padding:6px 6px 0}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* Buttons and pills */
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:9px;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink)}
.btn:hover{border-color:var(--olive)}
.btn.pri{background:var(--olive);border-color:var(--olive);color:var(--on-olive)}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:99px;white-space:nowrap;font-weight:600}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-no{background:var(--no-soft);color:var(--no)}
.p-n{background:var(--surface-2);color:var(--muted)}
.p-acc{background:var(--olive-soft);color:var(--olive)}
.p-sig{background:var(--signal-soft);color:var(--signal)}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tags .p-n.t{font-family:var(--f-body);text-transform:none;letter-spacing:0;font-size:11.5px}

/* Tiers */
.tier{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tier-band{position:relative;height:clamp(150px,24vw,220px);background:#1d211b}
.tier-band img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tier-band::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,10,8,.82) 0%,rgba(8,10,8,.45) 55%,rgba(8,10,8,.1) 100%)}
.tier-band .lab{position:absolute;z-index:1;left:18px;right:18px;bottom:14px;color:var(--photo-ink);display:flex;flex-direction:column;gap:2px}
.tier-band .lab .eyebrow{color:var(--photo-dim)}
.tier-band .lab h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(28px,5vw,40px);line-height:.95;text-transform:uppercase}
.tier-band .lab .when{font-size:13px;color:var(--photo-dim)}
.tier-meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.tier-meta>div{background:var(--surface);padding:10px 14px;min-width:0;font-size:13.5px}
.tier-meta .eyebrow{display:block;margin-bottom:2px}
@media (max-width:700px){.tier-meta{grid-template-columns:1fr}}
.tier-sum{padding:12px 16px 4px;color:var(--muted);font-size:14px;max-width:70ch;margin:0}
.tier-prog{display:flex;align-items:center;gap:10px;padding:8px 16px 4px}
.tier-prog .meter{flex:1;margin:0}
.tier-classes{padding:8px 16px 14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-top:1px solid var(--line)}
.chiplink{appearance:none;border:1px solid var(--line);background:var(--bg);padding:4px 10px;border-radius:99px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink)}

.step{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:11px 16px 11px 14px;border-top:1px solid color-mix(in srgb,var(--line) 65%,transparent)}
.check{appearance:none;width:24px;height:24px;border-radius:7px;border:1.5px solid color-mix(in srgb,var(--muted) 70%,transparent);background:var(--surface);cursor:pointer;display:grid;place-items:center;margin-top:1px;flex:none}
.check:checked{background:var(--olive);border-color:var(--olive)}
.check:checked::after{content:"";width:6px;height:11px;border:solid var(--on-olive);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.st-head{appearance:none;border:0;background:transparent;padding:0;text-align:left;width:100%;cursor:pointer;display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.st-title{font-weight:600;font-size:15px;line-height:1.35}
.st-title .new{margin-left:6px;vertical-align:2px}
.step.done .st-title{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent)}
.st-one{font-size:13.5px;color:var(--muted);margin-top:2px;display:block}
.chev{width:16px;height:16px;flex:none;margin-top:3px;transition:transform .2s ease;color:var(--muted)}
.open>.st-main .chev,.acc.open .chev{transform:rotate(180deg)}
.st-detail{margin-top:10px;font-size:14px;display:flex;flex-direction:column;gap:10px}
.st-detail p{margin:0;max-width:68ch}
.st-detail ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.facts{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:4px 14px;background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:13px;margin:0}
.facts dt{color:var(--muted);font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding-top:2px}
.facts dd{margin:0;min-width:0;font-variant-numeric:tabular-nums}
.links{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.note{width:100%;min-height:54px;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 10px;font-size:13.5px;resize:vertical;color:var(--ink)}

/* Toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:99px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;color:var(--ink)}
.search::placeholder{color:var(--muted)}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);cursor:pointer;user-select:none}
.switch input{accent-color:var(--olive);width:16px;height:16px}

/* Classes */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.course{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.course.st-booked{border-color:color-mix(in srgb,var(--signal) 55%,var(--line))}
.course.st-done{opacity:.72}
.c-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.c-name{font-weight:700;font-size:16px;line-height:1.25}
.c-by{font-size:12.5px;color:var(--muted)}
.c-cost{font-family:var(--f-display);font-weight:700;font-size:21px;white-space:nowrap;text-align:right;line-height:1}
.c-cost small{display:block;font-family:var(--f-mono);font-weight:500;font-size:10.5px;color:var(--muted);margin-top:3px}
.c-note{font-size:13.5px;margin:0}
.dates{display:flex;flex-wrap:wrap;gap:5px}
.date{font-family:var(--f-mono);font-size:11.5px;padding:3px 7px;border-radius:6px;background:var(--surface-2);font-variant-numeric:tabular-nums}
.date.so{text-decoration:line-through;color:var(--muted)}
.date.promo{background:var(--olive-soft);color:var(--olive)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface-2);border-radius:9px;padding:3px;gap:3px}
.seg button{appearance:none;border:0;background:transparent;border-radius:7px;padding:6px 4px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px var(--shade),0 0 0 1px var(--line)}
.seg button[data-s="booked"][aria-pressed="true"]{color:var(--signal)}
.seg button[data-s="done"][aria-pressed="true"]{color:var(--ok)}
.c-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline;font-size:13px}

/* Calendar */
.month{display:flex;flex-direction:column;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.month h3{margin:0;padding:10px 14px;font-family:var(--f-display);font-weight:700;font-size:20px;text-transform:uppercase;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
.ev{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:12px;padding:10px 14px;border-top:1px solid color-mix(in srgb,var(--line) 65%,transparent);align-items:start}
.ev:first-of-type{border-top:0}
.ev .d{font-family:var(--f-mono);font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.35}
.ev .d small{display:block;color:var(--muted);font-weight:500}
.ev .what{font-weight:600;font-size:14.5px;line-height:1.3}
.ev .where{font-size:12.5px;color:var(--muted)}
.ev .side{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
@media (max-width:560px){.ev{grid-template-columns:70px minmax(0,1fr)}.ev .side{grid-column:2;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:flex-start}}

/* Standards */
.drill{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.dr-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.dr-name{font-weight:700;font-size:16px}
.dr-setup{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin-top:2px}
.pars{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:6px}
.par{background:var(--surface-2);border-radius:9px;padding:7px 8px;min-width:0}
.par .lbl{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.par .v{font-family:var(--f-mono);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.par.hit{background:var(--olive-soft)}
.par.hit .v{color:var(--olive)}
.dr-how{font-size:13.5px;margin:0}
.logrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.logrow input{width:110px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 9px;font-family:var(--f-mono);font-size:14px;color:var(--ink)}
.hist{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:12px;align-items:center}
.hist ol{list-style:none;margin:0;padding:0;font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.hist ol li{display:flex;justify-content:space-between;gap:8px}
.hist ol li b{color:var(--ink);font-weight:600}
.hist ol li button{appearance:none;border:0;background:none;color:var(--muted);cursor:pointer;padding:0 2px}
.spark{width:150px;height:44px}
.spark .ln{fill:none;stroke:var(--olive);stroke-width:1.8}
.spark .ar{fill:var(--olive-soft)}
.spark .pt{fill:var(--signal)}
.spark .gd{stroke:var(--line);stroke-width:1;stroke-dasharray:2 3}

/* Budget */
.ledger{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) 130px 120px;gap:10px;padding:10px 14px;border-top:1px solid var(--line);align-items:center}
.lrow:first-child{border-top:0}
.lrow.head{background:var(--surface-2);font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lrow .nm{font-weight:600;min-width:0}
.lrow .nm small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.lrow .num{font-family:var(--f-mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.lrow input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;font-family:var(--f-mono);font-size:13px;text-align:right;color:var(--ink)}
.lrow.total{background:var(--surface-2);font-weight:700}
.lines{grid-column:1/-1;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:2px;padding-top:4px}
.lines div{display:flex;justify-content:space-between;gap:10px}
.lines div span:last-child{font-family:var(--f-mono);white-space:nowrap}
@media (max-width:560px){.lrow{grid-template-columns:minmax(0,1fr) 96px 92px;padding:10px 10px}}
.bars{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:110px minmax(0,1fr) 80px;gap:10px;align-items:center;font-size:12.5px}
.bar-row .lab{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row .trk{position:relative;height:14px;background:var(--surface-2);border-radius:4px}
.bar-row .rng{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--olive) 35%,transparent);border-radius:4px}
.bar-row .spent{position:absolute;top:3px;bottom:3px;left:0;background:var(--signal);border-radius:3px}
.bar-row .num{font-family:var(--f-mono);text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}

/* Rules + places (ported) */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card-h{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.card-h h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:21px;text-transform:uppercase}
.zone{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:11px 14px;border-top:1px solid var(--line);align-items:start}
.zone-name{font-weight:600;font-size:14.5px}
.zone-note{grid-column:1/-1;font-size:13px;color:var(--muted)}
.acc{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.acc-h{appearance:none;border:0;background:transparent;width:100%;text-align:left;padding:13px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;cursor:pointer}
.acc-h>span:first-child{font-weight:700;font-size:15px}
.acc-b{padding:0 16px 14px;font-size:14px;display:flex;flex-direction:column;gap:8px}
.acc-b p{margin:0;max-width:68ch}
.acc-b ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.place{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pl-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pl-name{font-weight:700;font-size:15.5px;line-height:1.3}
.pl-where{font-size:12.5px;color:var(--muted)}
.drive{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);white-space:nowrap;text-align:right}
.drive b{display:block;color:var(--ink);font-size:14px}
.pl-note{font-size:13.5px;margin:0}
.pl-more{appearance:none;border:0;background:none;padding:0;color:var(--olive);font-weight:600;font-size:13px;cursor:pointer;align-self:flex-start}
.empty{color:var(--muted);text-align:center;padding:28px 0;font-size:14px;margin:0}
.sources{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.sources ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.sources a{color:var(--muted)}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;max-width:70ch;margin:0}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:13px;z-index:20;opacity:0;transition:opacity .2s ease;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:520px){#hcount{display:none}.wordmark{font-size:22px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
const OLD={
phases:[
{id:'p1',title:'Get your bearings',when:'Weeks 1 to 2',summary:'Learn on rental guns before you own one, and start the license clock on day one.',steps:[
{id:'s1',short:'Apply for the CCW',title:'Apply for the CCW on CCW Pro',one:'Day one. The Sheriff\'s queue is the long pole.',
body:`<p>Rancho Santa Fe is unincorporated, so the San Diego Sheriff's License Division is your only licensing authority. Apply online, pay the first fees, and book the earliest appointment shown. Then check the portal several times a day for cancellations. Applicants in 2025 who did this pulled their appointment in from months to days.</p>
<ul><li>References: three. If you're married, your spouse must be one of them, and a spouse satisfies both reference rules. Family-only references have been approved.</li><li>Disclose everything. Since Jan 2026 (AB 1078), inaccurate or incomplete answers require denial or revocation.</li><li>Cannabis use is a disqualifier: CA borrows the federal "unlawful drug user" definition.</li><li>You can list guns later, but you need at least one recorded to you by the course, so buy next week.</li></ul>`,
facts:[['Portal','CCW Pro (replaced Permitium in 2024)'],['Pay now','$128.20 ($35.20 Sheriff + $93 Livescan)'],['Bring','CA license, 2 monthly proofs of residence (utility, phone, bank; no P.O. box), job history'],['Contact','ccw@sdsheriff.org · 858-974-2020']],
links:[['CCW Pro portal','https://ccw-sdsd.cssa.cloud'],['Sheriff CCW page','https://www.sdsheriff.gov/i-want-to/get-a-permit-or-license/regulatory-licenses-and-fees/concealed-weapons-license']]},
{id:'s2',short:'Beginner class',title:'Take a beginner class on rental guns',one:'PWG Handgun First Steps: $99, 3 hours, gun and ammo included.',
body:`<p>Your first hours set habits you will spend years keeping or undoing. Take a structured class rather than a buddy trip to the range. PWG's First Steps is the community default for true beginners. If you want faster progress, book a private instructor for the same block of time.</p>`,
facts:[['Where','PWG Range, 13550 Danielson St, Poway'],['Cost','$99, gun, ammo, targets provided'],['Then','Defensive Handgun, $199 (Phase 3)']],
links:[['Handgun First Steps','https://www.pwgrange.com/class/handgun-first-steps/']]},
{id:'s3',short:'Pass the FSC',title:'Pass the Firearm Safety Certificate',one:'$25, 30 questions, 23 to pass, at any dealer.',
body:`<p>Required to buy any gun. Read the DOJ study guide once; most people pass on the first try. You get two attempts for the fee, and a retake is allowed after 24 hours. It's valid for 5 years. Once you hold a CCW you're exempt from it going forward.</p>`,
facts:[['Cost','$25'],['Test','30 questions, 75% (23) to pass'],['Valid','5 years']],
links:[['DOJ FSC FAQ','https://oag.ca.gov/firearms/fscfaqs']]},
{id:'s4',short:'Rent 4 to 6 guns',title:'Rent and shoot 4 to 6 carry guns',one:'Pick by what you shoot best on a timer, then what conceals on you.',
body:`<p>Dealers can only sell new guns on the California roster, and since July 1, 2026 they cannot sell new Glock-pattern pistols (AB 1127). Shoot each candidate at 7 yards on a timer and pick the one where your hits stay tight at speed. Concealment comes second; any of these hide on most bodies in an appendix holster.</p>
<ul><li>Sig P365 X-Macro or XL (CA SKUs): the carry default, optic-ready.</li><li>S&W M&P9 2.0 Compact Carry Comp or Shield Plus OR.</li><li>Springfield Hellcat Pro or Echelon 4.0C CA.</li><li>HK VP9L, CZ P-10C OR, Walther PDP (verify on the roster).</li><li>Glock 43X CA: added to the roster Sept 29, 2026, shipping around December.</li><li>Skip the Sig P320. ShivWorks, Gabe White, and Modern Samurai Project all ban it in class.</li></ul>`,
facts:[['Rent at','PWG (free with membership), Iron Sights (130+ guns)'],['Check SKU','DOJ roster search, exact model number']],
links:[['CA handgun roster','https://oag.ca.gov/firearms/certified-handguns/search'],['Recent additions','https://oag.ca.gov/firearms/certified-handguns/recently-added']]}
]},
{id:'p2',title:'Buy and secure',when:'Weeks 2 to 4',summary:'The safe goes in before the gun comes home. Locked storage is mandatory in California since Jan 2026, and with kids in the house it is the highest-stakes decision on this list.',steps:[
{id:'s5',short:'Install safes',title:'Install a bedside quick-access safe and a main safe',one:'Every gun not on your body is locked. No nightstand drawers.',
body:`<p>PC 25145 (effective Jan 1, 2026) requires every firearm in a home to be in a DOJ-certified safe or disabled by a certified lock unless it's on you or close enough to control. Separately, PC 25100 makes it a crime to store a gun where a child is likely to get it, even if nothing happens. Bolt a biometric or keypad quick-access safe at the bedside for the carry gun overnight, and keep everything else in the main safe.</p>`,
facts:[['Law','PC 25145; PC 25100'],['Fines','$250, then $500, then misdemeanor'],['Buy','Only models on the DOJ certified list']],
links:[['PC 25145 text','https://california.public.law/codes/penal_code_section_25145']]},
{id:'s6',short:'Buy the gun',title:'Buy the carry gun',one:'Roster gun, optic-ready. 10-day wait starts at the counter.',
body:`<p>Buy optic-ready and mount an enclosed-emitter red dot (Holosun EPS Carry or 507K, Aimpoint Acro P-2). The dot is now the modern default and is easier to learn on than it looks. At the dealer you'll do the paperwork, a hands-on safe handling demo, and show a safe receipt or take the included lock. Pick up within 30 days of the transfer or it cancels.</p>
<ul><li>California caps you at 3 firearm purchases per 30 days (since Apr 1, 2026). A CCW does not exempt you.</li><li>Dealers now record video and audio of every sale (PC 26806).</li></ul>`,
facts:[['DROS','$37.19'],['Taxes','11% state excise + sales tax'],['Wait','10 days'],['All-in','about $1,200 to 1,500 with a dot (estimate)']],
links:[['DOJ buyer FAQ','https://oag.ca.gov/firearms/pubfaqs']]},
{id:'s7',short:'Holster and mags',title:'Holster, belt, and five magazines',one:'Rigid appendix Kydex with a claw, a stiff gun belt, 10-round mags.',
body:`<p>The holster is a safety device. Get rigid Kydex that fully covers the trigger guard, with a claw or wing for concealment: PHLster, Tenicor, JM Custom Kydex, Dark Star Gear, or T.Rex Arms. Add a 1.5-inch gun belt. Classes expect five magazines; California caps them at 10 rounds even with a CCW.</p>`,
facts:[['Budget','$300 to 500'],['Mags','5, 10-round max']]},
{id:'s8',short:'Ammo and lockbox',title:'Buy ammo and a car lockbox',one:'1,000 practice rounds, 100 hollow points, one DOJ-listed lockbox.',
body:`<p>Ammo is sold face to face with a background check. Your first purchase is the $19 basic check; once your gun's record posts at your current address, every purchase after is a $5 standard check. Carry ammo should be an FBI-protocol hollow point (Speer Gold Dot, Federal HST, Winchester Ranger T). The lockbox lets you legally leave the gun in the car outside the many places you can't carry.</p>`,
facts:[['Check fee','$19 first, then $5'],['Practice','9mm FMJ, about 35 to 40 cents/round with taxes (estimate)']],
links:[['DOJ ammo fee','https://oag.ca.gov/firearms/regs/ammofee']]}
]},
{id:'p3',title:'Fundamentals',when:'Months 1 to 3',summary:'Safe gun handling and a clean draw come before anyone puts you under stress. Dry fire does most of the work; live fire confirms it.',steps:[
{id:'s9',short:'Join PWG',title:'Join a range and get holster qualified',one:'PWG Gold, then Defensive Handgun to unlock draw practice.',
body:`<p>PWG is the best facility in the county, and every membership includes free rentals. Members who pass PWG's holster qualification can draw on the 25 and 50 yard bays. Its $199 Defensive Handgun class covers the draw, malfunctions, and California use of force. Appendix draws on the line are reportedly not allowed, so practice appendix in dry fire.</p>`,
facts:[['Gold','$200 to join + $49/mo, 50 yd lanes'],['Silver','$75 + $29/mo, 25 yd only'],['Class','Defensive Handgun $199']],
links:[['PWG membership','https://www.pwgrange.com/membership'],['Defensive Handgun','https://www.pwgrange.com/class/defensive-handgun/']]},
{id:'s10',short:'Private lessons',title:'Book 3 to 4 private lessons',one:'Fastest way to build clean fundamentals. Insist on a shot timer.',
body:`<p>Group classes can't fix your grip and trigger as fast as one coach can. Names that came up repeatedly in 2024 to 2026 San Diego threads: West Coast Kinetic Solutions (Oceanside, Level 1 covers strong-side and appendix draw), H2K Defense (own outdoor range, movement and reloads), and John Woo at PWG. Vet anyone with the red flags in the Places tab.</p>`,
facts:[['Budget','$100 to 150/hr (estimate)']]},
{id:'s11',short:'Dry fire daily',title:'Dry fire 10 to 15 minutes, 5 days a week',one:'Draws, reloads, trigger work. Dry reps outnumber live 3 to 5 to 1.',
body:`<p>Every serious shooter does this. Use a dedicated room with no ammunition in it and a solid backstop, and finish with a deliberate "last rep" ritual so you never dry fire a loaded gun. A MantisX sensor diagnoses grip and trigger faults early. Ben Stoeger's <em>Dry Fire Reloaded</em> is the standard workbook.</p>`,
facts:[['Tools','MantisX, DryFireMag (fits P365, M&P, PDP)'],['Later','CoolFire CO2 trainer, $460+']]},
{id:'s12',short:'Weekly live fire',title:'Shoot weekly with a shot timer',one:'150 to 300 rounds. Test against the Drills tab, not feel.',
body:`<p>Run Dot Torture at 3 yards until it's clean, then the Sheriff's qualification, then FAST. A timer turns vague progress into numbers you can push.</p>`},
{id:'s13',short:'Stop the Bleed',title:'Take Stop the Bleed and carry a tourniquet',one:'Free or cheap, about 2 hours. A gunfight creates casualties.',
body:`<p>If you carry a gun you should carry the means to stop bleeding, yours or a family member's. Take a class and carry a CAT Gen 7 or SOF-T Wide tourniquet plus a compact trauma kit.</p>`,
links:[['Find a class','https://www.stopthebleed.org/']]},
{id:'s14',short:'Use-of-force law',title:'Learn California use-of-force law',one:'Law of Self Defense Level 1, about $90, with a free CA supplement.',
body:`<p>The legal aftermath is where most carriers are least prepared. Andrew Branca's online course is about 10 hours and includes a California supplement. Later, the Massad Ayoob Group's MAG-20 Classroom ($525) or MAG-40 ($1,000) are the gold standard, but they currently have no West Coast dates.</p>`,
links:[['Law of Self Defense','https://lawofselfdefense.com/core']]},
{id:'s15',short:'First match',title:'Shoot your first match',one:'Escondido Fish & Game Combat Match, 1st Saturday, $20.',
body:`<p>A match is the cheapest pressure you can buy: a timer, an audience, and a holster. EFGA's Combat Match is beginner-to-intermediate steel shot from the holster. Show up for the 7:00 start; the 8:00 safety brief is mandatory. Register on Practiscore.</p>`,
facts:[['Bring','Holster covering the trigger, 3 mags, about 120 rounds'],['No','Steel-core ammo']],
links:[['Combat Match','https://www.escondidofishandgame.com/events/combat-match/']]}
]},
{id:'p4',title:'Get licensed',when:'Months 1 to 6, in parallel',summary:'The Sheriff runs on its own clock: about 75 to 90 days from your appointment to conditional approval, then the course, then the card by mail. One 2025 applicant went from application to card in 118 days.',steps:[
{id:'s16',short:'Ridgehaven visit',title:'Attend the Ridgehaven appointment',one:'One visit: document review, Livescan, photo. About 90 minutes.',
body:`<p>The Sheriff cut in-person visits from three to one. The payment link may arrive by email the morning of. Bring originals of everything you uploaded.</p>`,
facts:[['Where','9621 Ridgehaven Ct, San Diego 92123'],['Interview','Fact check of your application, no "good cause" grilling']]},
{id:'s17',short:'Background wait',title:'Wait out the background check',one:'About 75 to 90 days. References get called near the end.',
body:`<p>Status usually changes around day 78 to 80, followed by calls to your references. By law the Sheriff must notify you within 120 days of a complete application or 30 days after DOJ results, whichever is later. If you stall, email ccw@sdsheriff.org; posters describe staff as responsive. Denials can be appealed within 21 days.</p>`,
facts:[['2025 data','76 and 74 days, appointment to approval'],['Law','PC 26205']]},
{id:'s18',short:'Book the 16-hour',title:'Book the 16-hour course for just after approval',one:'Book during the wait; take it after the "Approved: More Actions Required" email.',
body:`<p>Only certificates from the Sheriff's approved vendor list count, and you must qualify with every gun you want on the license. The Sheriff's pages say both 90 days and 6 months to finish after approval, so plan on 90. The qualification is easy if you've done Phase 3: 15 rounds at 7, 5, and 3 yards, including one-handed strings, and 13 of 15 must hit.</p>
<ul><li>Practical Is Tactical (Pala Range), $340: unlimited guns, includes Arizona and Utah permit certificates, run by a CA POST firearms instructor.</li><li>Discount Gun Mart (Kyle Dau), $400: the most-endorsed instructor across San Diego threads.</li><li>PWG Concealed American, $499: two days, up to 3 guns, closest.</li></ul>`,
facts:[['Rounds','100 total; 30 per extra gun'],['Pass','13/15 at 3 to 7 yards']],
links:[['Approved vendor list','https://www.sdsheriff.gov/home/showpublisheddocument/10203/639161840866700000']]},
{id:'s19',short:'Close out',title:'Close out and receive the card',one:'Upload the certificate and issuance letter, pay $140.80. Card by mail.',
body:`<p>Upload both sides of the signed Issuance Letter and your qualification certificate, pay the final fee, then email the Sheriff to confirm. Cards arrive in 1 to 4 weeks. You can modify the license twice per 2-year term ($10 each) to add or drop guns.</p>`,
facts:[['Sheriff + DOJ','$269 total'],['With course','about $610 to 770']]},
{id:'s20',short:'Start carrying',title:'Start carrying, with the rules down cold',one:'No drinking at all, 2 guns max, lockbox in the car.',
body:`<p>Read the Rules tab before your first day. Most of the friction in North County daily life comes from three rules: no carry in restaurants that serve alcohol, no carry in parks and on beaches, and no alcohol at all while carrying. Plan to lock the gun in the car often.</p>`}
]},
{id:'p5',title:'Train hard',when:'Months 3 to 12',summary:'The rigorous part. Immersion first, then modern instructors who test you against published standards, then unscripted force-on-force once your draw is safe.',steps:[
{id:'s21',short:'Gunsite 250',title:'Gunsite Day Zero + 250 Defensive Pistol',one:'5 days in Paulden, AZ. The best on-ramp that accepts true beginners.',
body:`<p>Almost every elite modern instructor turns away brand-new shooters; Gunsite doesn't. The 250 is a safe, immersive bootcamp with simulators and a night shoot, and it rents pistols if you'd rather not travel with yours. The critique is real: some doctrine is dated and its standards are softer than Gabe White's or Rangemaster's. Take it for immersion, then move to the instructors below. Book early; sessions sell out.</p>`,
facts:[['Tuition','$2,135 + $250 Day Zero'],['Ammo','about 1,050 rounds'],['Rental','$35/day, $45 with a dot'],['Next','Nov 30–Dec 4, Jan 11–15, Feb 1–5 (Bring-a-Buddy)'],['Unlocks','350, Vehicle Defense, Concealed Carry Pistol']],
links:[['Gunsite 250','https://www.gunsite.com/event/250-defensive-pistol-21/'],['Day Zero','https://www.gunsite.com/classes/day-zero/']]},
{id:'s22',short:'Start BJJ',title:'Start grappling twice a week',one:'Most fights at contact distance are wrestling matches first.',
body:`<p>Brazilian jiu-jitsu or no-gi grappling is the most-cited complement to defensive shooting. It makes ECQC far more productive and covers the fitness base several classes assume.</p>`},
{id:'s23',short:'Modern Samurai',title:'Modern Samurai Project: AIWB Path to Performance',one:'Livermore, Feb 27–28, 2027, $600. Ends with a timed standards test.',
body:`<p>Scott Jedlinski's classes are the modern benchmark for red dot and appendix carry, with "Black Belt" standards tested on day two. Requires familiarity with a pistol, so take it after Gunsite.</p>`,
facts:[['Ammo','700 rounds, 5 mags'],['Holster','Kydex with claw'],['Banned','Sig P320']],
links:[['MSP schedule','https://shop.modernsamuraiproject.com/collections/all']]},
{id:'s24',short:'Local scenarios',title:'Local scenario training in Escondido',one:'Tactical Hyve Essential Defense, Jan 30–31, 2027, $750.',
body:`<p>Shoot/no-shoot decisions, medical, police interaction, and optional force-on-force on a private range in Escondido. Lead instructor is a retired Navy SEAL; the company's own reviews note the founder has no military, law enforcement, or competition background. Its Force on Force class runs Mar 27–28, 2027.</p>`,
links:[['Tactical Hyve schedule','https://tacticalhyve.corsizio.com/']]},
{id:'s25',short:'Rangemaster TacCon',title:'Rangemaster Tactical Conference',one:'Dallas, Apr 2–4, 2027. The best instructors in one weekend.',
body:`<p>Tom Givens' conference is the best sampler of top defensive instructors anywhere, including names who rarely teach in the West. Use it to pick who to train with next.</p>`,
links:[['Rangemaster classes','https://rangemaster.corsizio.com/']]},
{id:'s26',short:'ShivWorks ECQC',title:'ShivWorks ECQC (force-on-force)',one:'Month 9 to 12. Full-contact, unscripted, humbling.',
body:`<p>Craig Douglas' Extreme Close Quarters Concepts is widely called the most important class for armed citizens: grappling for the gun, fighting from the draw, and marking-cartridge scenarios against resisting partners. It is not a beginner class. The 2026 SoCal run (Nov 20–22, Azusa) is too soon; take the next one.</p>`,
facts:[['Cost','$775 + $60 range fee'],['Bring','Mouthpiece, cup, 220 rounds'],['Banned','Sig P320']],
links:[['ShivWorks schedule','https://shivworks.corsizio.com/']]},
{id:'s27',short:'Gabe White pins',title:'Gabe White: Pistol Shooting Solutions',one:'The community\'s best-known standard. Watch for an Arizona date.',
body:`<p>Two days built around four timed drills at 7 yards, graded Dark, Light, and Turbo pins (see Drills). Not for beginners: you must hit a 6-inch square at 10 yards on demand and draw safely from concealment. Tucson ran in Oct 2026.</p>`,
facts:[['Cost','$595 + $60'],['Class size','14 max'],['Banned','All P320 variants']]}
]},
{id:'p6',title:'Stay sharp',when:'Year 2 onward',summary:'Shooting skill fades within weeks of stopping. Keep a cadence and keep the paperwork current.',steps:[
{id:'s28',short:'Monthly match',title:'A match a month, benchmarks every quarter',one:'USPSA at Pala on the 2nd and 4th Sundays, $50.',
body:`<p>Linea de Fuego runs sanctioned USPSA at Pala and welcomes new shooters. EFGA's Fun Action Match on the 4th Saturday is a gentler USPSA-style option. Re-run the Drills tab every quarter and log the numbers.</p>`,
links:[['Linea de Fuego','https://lineadefuego.net']]},
{id:'s29',short:'Utah permit',title:'Get a Utah nonresident permit for travel',one:'$90. California honors no other permits, and few states honor California\'s.',
body:`<p>A California license is almost useless outside California. A Utah nonresident permit (often paired with Arizona or Florida) covers far more states, and California residents can apply directly. The Practical Is Tactical CCW course already includes the Utah and Arizona certificates.</p>`,
links:[['Utah BCI','https://bci.utah.gov/concealed-firearm/how-do-i-apply-for-a-concealed-firearm-permit/']]},
{id:'s30',short:'Renew on time',title:'Renew inside the 90-day window',one:'8-hour course, new Livescan, $77 Sheriff and DOJ fee.',
body:`<p>The license lasts 2 years. File in the 90 days before it expires with an 8-hour course certificate in hand. Since Jan 2026, if you miss the window you start over as a new applicant. Renewed cards date from the old expiration, so filing early costs nothing. Since Sept 2026 each renewal needs a fresh $93 Livescan. Mid-2026 renewals took weeks.</p>`,
facts:[['Course','$249 to 299'],['Fees','$77 + $93 Livescan']]}
]}
],

rulesIntro:'Verified Oct 24, 2026. The carry map comes from SB 2 as trimmed by the Ninth Circuit in 2024, plus the Supreme Court\'s Wolford ruling in June 2026. Search a place to see where it lands.',
zones:[
{name:'Anywhere, after any alcohol',s:'no',alias:'drink beer wine dinner party',note:'A licensee may not drink at all while carrying, or carry while under the influence of alcohol, drugs, or medication (PC 26200).'},
{name:'Restaurants and bars that serve alcohol',s:'no',alias:'brewery taproom winery hotel bar club grill dinner',note:'Any place licensed to sell alcohol for on-site drinking, including its parking lot. That covers most sit-down restaurants. Upheld by the Ninth Circuit and enforced since Jan 2025.'},
{name:'Golf clubhouse or grill',s:'no',alias:'golf club country club',note:'If it serves alcohol on site, it falls under the alcohol rule. The course itself is private property under the club\'s own policy.'},
{name:'Public parks and athletic fields',s:'no',alias:'park beach little league soccer field playground youth sports trail balboa',note:'Includes athletic facilities open to the public and adjacent sidewalks, so youth ball fields count. Most city and county beaches are parks. Playgrounds and youth centers are separately banned.'},
{name:'State parks and state beaches',s:'no',alias:'torrey pines carlsbad san elijo cardiff beach anza borrego',note:'All State Parks and Fish & Wildlife land, which covers most coastal state beaches in North County.'},
{name:'Hiking trails',s:'dep',alias:'hike trail elfin forest lake hodges cleveland national forest',note:'Trails in city or county parks and open-space preserves count as parks: no. State parks: no. National forest land outside federal buildings generally follows state law.'},
{name:'K-12 schools, preschools, childcare',s:'no',alias:'school pickup daycare preschool',note:'Grounds and parking lots. At pickup the gun stays in a locked box, out of view, in the car.'},
{name:'Colleges and universities',s:'no',alias:'ucsd usd csusm college campus',note:'Buildings, grounds, and parking. The public right-of-way exception does not apply to campuses.'},
{name:'Government buildings and courts',s:'no',alias:'dmv city hall courthouse county',note:'State, local, and court buildings including their parking areas. Use the car lockbox.'},
{name:'Post offices and federal buildings',s:'no',alias:'post office usps federal',note:'Federal law. The car lockbox exception does not cover federal property, so don\'t bring it into the lot.'},
{name:'Casinos and racetracks',s:'no',alias:'del mar racetrack horse racing casino pala valley view',note:'Gambling venues, explicitly including tracks licensed by the California Horse Racing Board.'},
{name:'Stadiums, arenas, pro and college games',s:'no',alias:'petco snapdragon pechanga concert',note:'Including their parking areas and any collegiate or pro sporting event.'},
{name:'Zoos and museums',s:'no',alias:'san diego zoo safari park museum',note:'Buildings, grounds, and parking.'},
{name:'Amusement parks',s:'no',alias:'legoland seaworld',note:'Including parking.'},
{name:'Airports',s:'no',alias:'san airport terminal flying',note:'Passenger terminals. To fly with a gun, check it unloaded in a locked hard case and declare it.'},
{name:'Libraries, police stations, polling places',s:'no',alias:'library police voting jail',note:'Also jails, prisons, and nuclear facilities.'},
{name:'Stores, offices, and businesses open to the public',s:'yes',alias:'grocery retail store mall office target costco',note:'California\'s "no carry unless posted" default is enjoined, and the Supreme Court struck Hawaii\'s version in June 2026. A posted no-guns sign or a request to leave still controls: leave.'},
{name:'Hospitals and doctors\' offices',s:'yes',alias:'hospital clinic urgent care dentist doctor medical',note:'Enjoined since 2023, so currently allowed. Could change when the trial court reaches final judgment.'},
{name:'Churches and places of worship',s:'yes',alias:'church worship',note:'The default ban is enjoined. Your church can still ask you not to carry.'},
{name:'Banks',s:'yes',alias:'bank credit union atm financial',note:'Enjoined, so currently allowed.'},
{name:'Public transit',s:'yes',alias:'coaster sprinter trolley bus mts nctd',note:'Enjoined. If that flips, a 2026 law still lets you carry it unloaded in a lockbox.'},
{name:'Permitted public events',s:'yes',alias:'street fair parade rally festival event',note:'The permitted-gathering ban is enjoined. Events on private property follow the owner\'s rules.'},
{name:'Your home and property',s:'yes',alias:'house home yard',note:'Allowed even without a license (PC 25605). When it\'s not on you, it\'s locked.'},
{name:'Your car',s:'yes',alias:'vehicle car truck drive',note:'Loaded on your person with a license. Left in the car, it goes in a locked box out of view or the trunk; an SUV cargo area is not a trunk.'},
{name:'Friends\' homes, hotels, your office',s:'dep',alias:'hotel friend office work employer',note:'Owner\'s or employer\'s rules govern. Any bar or restaurant area inside a hotel is a no.'},
{name:'Other states',s:'dep',alias:'travel arizona nevada utah hawaii',note:'Few states honor a California license. A Utah nonresident permit covers far more.'}
],
rules:[
{title:'Buying a handgun',conf:'High',body:`<ul><li>Firearm Safety Certificate: $25, 23 of 30 to pass, valid 5 years. CCW holders are exempt.</li><li>Age 21 for handguns. DROS fee $37.19, plus the 11% state excise tax (since July 2024) and sales tax.</li><li>Hands-on safe handling demo, then a 10-day wait. Pick up within 30 days or the sale cancels.</li><li>Limit: 3 firearms per rolling 30 days since Apr 1, 2026 (AB 1078). The old 1-in-30 handgun limit was struck down in 2025. CCW holders are not exempt.</li><li>Off-roster guns can only come through a private-party transfer at a dealer (up to $10 extra per gun).</li><li>Dealers record video and audio of every sale and keep it a year.</li></ul>`},
{title:'The roster and the Glock ban',conf:'Moderate',body:`<p>Since July 1, 2026, dealers cannot sell new pistols with a cruciform trigger bar that a backplate "switch" could convert to full auto (AB 1127). Every Gen 3 Glock on the roster is flagged. Owning one and buying one used through a private-party transfer stay legal.</p><ul><li>Glock 43X CA was added Sept 29, 2026 without the flag; deliveries are expected around December.</li><li>The U.S. Justice Department sued California on July 1, 2026; the request for an immediate block was denied July 9 and the case is pending.</li><li>A separate federal motion for an injunction was denied on procedural grounds Aug 24, 2026 (one source).</li><li>Microstamping is enjoined, which opened the roster to many new models in Sept 2026. Chamber indicators and magazine disconnects are still required, and the expansion could reverse if that injunction falls.</li></ul>`},
{title:'Storage at home',conf:'High',body:`<p>Since Jan 1, 2026, every gun in a home must be in a DOJ-certified safe or locked with a certified device unless it's on you or close enough to control (PC 25145). Fines start at $250, then $500, then misdemeanors.</p><p>Separately, storing a gun where a child is likely to get it is a crime even if nothing happens (PC 25100, third degree). If a child gets it and someone is hurt, it can be a felony.</p>`},
{title:'Driving without a license',conf:'High',body:`<ul><li>Unloaded, in the trunk or a locked container. A glove box or console does not count.</li><li>Carry it to and from the car in a locked container.</li><li>Unattended car: trunk, or a locked container out of view or bolted to the car. SUV cargo areas are not trunks. Up to $1,000 fine.</li></ul>`},
{title:'Carrying with a license',conf:'High',body:`<ul><li>Carry only guns listed on your license, and no more than two at once.</li><li>Carry the card. Show it, and surrender the gun for inspection, when an officer asks.</li><li>No alcohol at all, and no carrying under the influence of anything, including medication.</li><li>Don't display the gun without justification. Report new arrests, charges, and restraining orders.</li><li>Magazines are still capped at 10 rounds.</li><li>Breaking any license condition means mandatory revocation.</li><li>At banned places, you can drive into the lot and lock the gun in a DOJ-listed box out of view, except on federal property.</li></ul>`},
{title:'Ammunition',conf:'High',body:`<p>Every ammo purchase is in person with a background check: $19 for the first (valid 30 days), then $5 once your gun's record matches your address. Online orders ship to a vendor, who charges a handling fee. Bringing ammo bought out of state into California yourself is illegal. A federal appeals court is reconsidering the whole scheme en banc (argued Mar 25, 2026); until it rules, everything stays in force.</p>`},
{title:'Your privacy as a license holder',conf:'High',body:`<p>CCW applications and licenses are public records in California (<em>CBS v. Block</em>, 1986). Your name can be disclosed; details showing when or where you're vulnerable, and medical history, can be withheld. In June 2022 the state DOJ accidentally published names, birth dates, addresses, and driver's license numbers of roughly 192,000 CCW applicants for about a day. Assume the fact that you hold a license can become known.</p>`},
{title:'Travel',conf:'Moderate',body:`<ul><li>California honors no other state's permit, and few states honor California's.</li><li>A Utah nonresident permit costs $90 and California residents can apply directly. Arizona and Florida nonresident permits widen coverage further.</li><li>Federal law protects unloaded, locked transport through restrictive states.</li><li>Driving to Gunsite with your own gun is legal: unloaded and locked in California. Or rent there.</li></ul>`},
{title:'Pending cases to watch',conf:'Moderate',body:`<ul><li><strong>Rhode v. Bonta</strong>: ammo checks, en banc decision pending.</li><li><strong>Duncan v. Bonta</strong>: 10-round magazine limit, Supreme Court petition pending.</li><li><strong>U.S. v. California</strong>: the Glock ban and roster, injunction pending.</li><li><strong>May v. Bonta</strong>: the sensitive-places case resumed July 2026 after Wolford; the enjoined categories above could become permanent or flip.</li><li><strong>U.S. v. Hemani</strong> (June 2026) narrowed the federal drug-user ban, which may affect California's matching CCW disqualifier.</li><li>The 11% excise tax faces a state court challenge brought by PWG.</li></ul>`}
],
drillsIntro:'The community\'s measurable standards, ordered roughly by when you\'ll be ready for them. Log your best clean run, with miss penalties added to the time; the tier you reach lights up. Results stay on this device.',
drills:[
{id:'sdq',name:'Sheriff qualification',setup:'15 rds · 7, 5, 3 yd · one-handed strings',kind:'score',tiers:[['Pass','13/15',13],['Clean','15/15',15]],
how:'5 rounds two-handed at 7 yards, 5 at 5 yards, then 3 strong-hand and 2 weak-hand at 3 yards. 13 of 15 inside the line passes. The test that gets you the card, and a low bar.'},
{id:'dot',ph:'e.g. 47',name:'Dot Torture',setup:'50 rds · 3 yd · 10 dots, 2-inch',kind:'score',tiers:[['Pass at 3 yd','50/50',50]],
how:'Todd Green\'s precision test, including strong-hand, weak-hand, and reload strings. Once you clean it at 3 yards, back up a yard at a time. Use it as a test, not daily practice.'},
{id:'fast',ph:'e.g. 9.40',name:'F.A.S.T.',setup:'6 rds · 7 yd · from concealment',kind:'time',tiers:[['Intermediate','< 10.00',9.999],['Advanced','< 7.00',6.999],['Expert','< 5.00',4.999]],
how:'Draw, 2 rounds into a 3x5 card, slide-lock reload, 4 rounds into an 8-inch circle. Add 1 second per hit outside the circle and 2 per miss on the card. Best shot cold.'},
{id:'bill',name:'Bill Drill',setup:'6 rds · 7 yd · body A-zone',kind:'time',tiers:[['Dark pin','3.50',3.5],['Light pin','2.50',2.5],['Turbo pin','2.00',2.0]],
how:'Draw and fire six rounds into the A-zone. Gabe White\'s pin times; subtract 0.25 seconds if drawing from concealment. Add 0.25 per C-zone hit, 1 per D-zone, 2 per miss.'},
{id:'fail',ph:'e.g. 3.10',name:'Failure Drill',setup:'3 rds · 7 yd · 2 body, 1 head',kind:'time',tiers:[['Dark pin','2.90',2.9],['Light pin','2.25',2.25],['Turbo pin','1.70',1.7]],
how:'Two to the body, one to the head box. Same Gabe White penalties and concealment bonus as the Bill Drill.'},
{id:'casino',ph:'e.g. 26.4',name:'Casino Drill',setup:'21 rds · 5 yd · 3 mags of 7',kind:'time',tiers:[['Rangemaster par','21.0',21]],
how:'Tom Givens\' drill: shoot numbered shapes 1 through 6 in order with 1, 2, 3, 4, 5, then 6 rounds, with two reloads. Add 1 second per miss or out-of-order shot.'},
{id:'bad',ph:'e.g. 186',name:'Rangemaster Baseline',setup:'20 rds · B-8 · 5 to 10 yd',kind:'score',tiers:[['Pass','190/200',190]],
how:'Five strings from concealment, each with a par time: 5 at 5 yd in 5 s; strong-hand 3 in 3 s; weak-hand 2 in 3 s; 3, reload, 3 at 7 yd in 10 s; 4 at 10 yd in 4 s. Pass means every string under par and 190 or better.'},
{id:'wilson',ph:'e.g. 38.5',name:'Wilson 5x5',setup:'25 rds · 10 yd · IDPA target',kind:'time',tiers:[['Carry floor','50',50],['Expert','25',25],['Master','20',20],['Grandmaster','15',15]],
how:'Four 5-shot strings totaled with penalties. Over 50 seconds is rated "not proficient enough to carry."'}
],

let remote = null, saveT = null, saving = false, pending = false;
function setSync(mode,label){const el=document.getElementById('sync');el.className='sync '+mode;el.querySelector('span').textContent=label;}
function commit(msg){
  ST.updatedAt = Date.now();
  LS.set('state',ST);
  rerender();
  if(msg) toast(msg);
  if(remote){ clearTimeout(saveT); setSync('saving','Saving…'); saveT=setTimeout(flush,700); }
}
async function flush(){
  if(!remote) return;
  if(saving){pending=true;return;}
  saving=true;
  try{ await remote.set(JSON.parse(JSON.stringify(ST))); setSync('cloud','Saved to your account'); }
  catch(e){ setSync('','Saved on this device'); }
  saving=false; if(pending){pending=false;flush();}
}
async function connect(){
  try{
    if(!window.claude||!window.claude.use) return;
    const [db,user] = await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user) return;
    const uid = await user.id(); if(!uid) return;
    const ref = db.doc('data/users/'+uid+'/progress');
    setSync('saving','Connecting…');
    const timer = setTimeout(()=>setSync('','This device · cloud not reachable'),10000);
    let first = true;
    ref.onSnapshot(snap=>{
      if(snap.metadata && snap.metadata.fromCache && first) return;
      clearTimeout(timer);
      remote = ref;
      const d = snap.exists ? snap.data() : null;
      if(first){
        first=false;
        if(d && (d.updatedAt||0) > (ST.updatedAt||0)){ ST = Object.assign({done:{},course:{},logs:{},spent:{},notes:{},buy:{}}, JSON.parse(JSON.stringify(d))); LS.set('state',ST); rerender(); }
        else if(ST.updatedAt>0){ flush(); }
        setSync('cloud','Saved to your account');
        return;
      }
      if(d && !snap.metadata.hasPendingWrites && (d.updatedAt||0) > (ST.updatedAt||0)){
        ST = Object.assign({done:{},course:{},logs:{},spent:{},notes:{},buy:{}}, JSON.parse(JSON.stringify(d))); LS.set('state',ST); rerender();
      }
    }, err=>{ clearTimeout(timer); remote=null; setSync('','Saved on this device'); });
  }catch(e){}
}

function gantt(){
  const start=pd('2026-11-01'), end=pd('2028-01-01');
  const W=900, L=128, R=12, top=26, rowH=30, H=top+TIERS.length*rowH+10;

  const win = {t0:['2026-11-15','2026-12-01'],t1:['2026-11-24','2026-12-24'],t2:['2026-12-01','2027-03-15'],t3:['2026-11-24','2027-06-15'],t4:['2027-01-15','2027-08-31'],t5:['2027-06-01','2027-12-31'],t6:['2027-08-15','2027-12-31']};
  let g = '';
  for(let i=0;i<=14;i++){const d=new Date(Date.UTC(2026,10+i,1));const s=d.toISOString().slice(0,10);const xx=x(s);
    g+=`<line x1="${xx}" y1="${top-6}" x2="${xx}" y2="${H-6}" stroke="var(--line)" stroke-width="1"/>`;
    if(i<14) g+=`<text x="${xx+4}" y="${top-10}" font-size="10.5">${MON[d.getUTCMonth()]}${d.getUTCMonth()===0?' ’'+String(d.getUTCFullYear()).slice(2):''}</text>`;}
  TIERS.forEach((t,i)=>{const y=top+i*rowH;const w=win[t.id];const p=tierPct(t);
    g+=`<text x="0" y="${y+18}" font-size="11.5" style="fill:var(--ink)">${t.n} ${esc(t.title)}</text>`;
    g+=`<rect x="${x(w[0])}" y="${y+7}" width="${Math.max(4,x(w[1])-x(w[0]))}" height="14" rx="4" fill="color-mix(in srgb, var(--olive) 22%, transparent)"/>`;
    g+=`<rect x="${x(w[0])}" y="${y+7}" width="${Math.max(0,(x(w[1])-x(w[0]))*p)}" height="14" rx="4" fill="var(--olive)"/>`;
    if(t.id==='t6') g+=`<path d="M${x(w[1])-2} ${y+8} l8 6 l-8 6z" fill="color-mix(in srgb, var(--olive) 40%, transparent)"/>`;
    COURSES.filter(c=>c.tier===t.n).forEach(c=>{const st=cstat(c.id);const d=cdate(c.id)||(!st&&SUGGEST[c.id]);if(!d||d<'2026-11-01'||d>='2028-01-01')return;
      const solid=!!st; const cx=x(d);
      g+=`<g><title>${esc(c.name)} · ${fmtD(d)}</title><circle cx="${cx}" cy="${y+14}" r="6" fill="${solid?'var(--signal)':'var(--surface)'}" stroke="var(--signal)" stroke-width="2"/></g>`;});
  });
  const tx=x(TODAY); g+=`<line x1="${tx}" y1="${top-4}" x2="${tx}" y2="${H-6}" stroke="var(--ink)" stroke-width="1.5"/><text x="${tx+4}" y="${H-8}" font-size="10" style="fill:var(--ink)">today</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Tier timeline with class markers">${g}</svg>`;
}

const DRILL_TIER = {sdq:3,dot:2,fast:2,bill:4,fail:4,casino:5,bad:6,wilson:6};
function renderStandards(){
  const v=document.getElementById('v-standards');
  v.innerHTML = `<p class="lead">${OLD.drillsIntro.replace('Results stay on this device.','Every attempt is logged with its date, and your best lights up its tier.')}</p>
  <div class="callout"><span class="eyebrow">Two more standards on the path</span><p><strong>Gunsite grades:</strong> Marksman or better at the 250 is the gate to the 350; Marksman in both is the gate to the 499. <strong>USPSA classification:</strong> D below 40%, C 40–60, B 60–75, A 75–85, M 85–95, GM 95 and up. Aim for C in your first classified year.</p></div>
  <div class="grid2" id="dlist"></div>`;
  const box=v.querySelector('#dlist');
  box.innerHTML = OLD.drills.map(d=>{const logs=ST.logs[d.id]||[];const best=bestOf(d,logs);const hit=gradeIdx(d,best);
    return `<article class="drill" id="d-${d.id}">
      <div class="dr-top"><div style="min-width:0"><div class="dr-name">${esc(d.name)}</div><div class="dr-setup">${esc(d.setup)}</div></div><span class="pill p-acc">Tier ${DRILL_TIER[d.id]??''}</span></div>
      <div class="pars" style="--n:${d.tiers.length}">${d.tiers.map((t,i)=>`<div class="par ${i===hit?'hit':''}"><div class="lbl">${esc(t[0])}</div><div class="v">${esc(t[1])}</div></div>`).join('')}</div>
      <p class="dr-how">${d.how}</p>
      <div class="logrow"><input id="in-${d.id}" inputmode="decimal" placeholder="${d.kind==='score'?'Score':'Seconds'}" aria-label="New ${d.kind==='score'?'score':'time'} for ${esc(d.name)}"><button class="btn pri" data-log="${d.id}">Log ${d.kind==='score'?'score':'time'}</button><span class="mini">${best==null?'No attempts yet':'Best '+best+(hit>=0?' · '+d.tiers[hit][0]:' · below first tier')}</span></div>
      ${logs.length?`<div class="hist"><ol>${logs.slice(-5).reverse().map((l,i)=>`<li><span>${fmtD(l.d)} ’${l.d.slice(2,4)}</span><b>${l.v}</b><button aria-label="Delete entry" data-del="${d.id}|${logs.length-1-i}">×</button></li>`).join('')}</ol>${spark(d,logs)}</div>`:''}
    </article>`}).join('');
  box.querySelectorAll('[data-log]').forEach(b=>{const id=b.dataset.log;const inp=document.getElementById('in-'+id);
    const go=()=>{const val=parseFloat(inp.value);if(isNaN(val)){toast('Enter a number first');return;}(ST.logs[id]=ST.logs[id]||[]).push({d:TODAY,v:val});commit('Logged '+val);};
    b.addEventListener('click',go);inp.addEventListener('keydown',e=>{if(e.key==='Enter')go();});});
  box.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>{const [id,i]=b.dataset.del.split('|');ST.logs[id].splice(+i,1);commit('Entry deleted');}));
}
function bestOf(d,logs){if(!logs.length)return null;const vs=logs.map(l=>l.v);return d.kind==='score'?Math.max(...vs):Math.min(...vs);}
function gradeIdx(d,v){if(v==null)return -1;let b=-1;d.tiers.forEach((t,i)=>{const n=t[2];if(n==null)return;if(d.kind==='score'?v>=n:v<=n)b=i;});return b;}
function spark(d,logs){
  const W=150,H=44,p=4; const vs=logs.map(l=>l.v); if(vs.length<2) return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><circle class="pt" cx="${W/2}" cy="${H/2}" r="3"/></svg>`;
  const lo=Math.min(...vs),hi=Math.max(...vs),rg=(hi-lo)||1;
  const pts=vs.map((v,i)=>[p+i*(W-2*p)/(vs.length-1), d.kind==='score'? H-p-(v-lo)/rg*(H-2*p) : p+(v-lo)/rg*(H-2*p)]);
  const line=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  const last=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Trend over ${vs.length} attempts, higher is better"><line class="gd" x1="0" y1="${H-p}" x2="${W}" y2="${H-p}"/><path class="ar" d="${line} L${last[0]} ${H} L${pts[0][0]} ${H}Z"/><path class="ln" d="${line}"/><circle class="pt" cx="${last[0]}" cy="${last[1]}" r="3"/></svg>`;
}

['ops','Chapter 3 · Operation and safe handling','pp. 10–25',['Cartridge = case, primer (impact-sensitive ignition), propellant, bullet. The bullet is just the projectile.','Caliber = barrel or bullet diameter. Common calibers: .22, .45, 9 mm. Pistols show caliber on the slide; revolvers on the barrel.','Fits ≠ safe. Never shoot old, dirty, corroded, wet or unidentified ammo; never throw ammo in the trash.','Dangerous range: most ammo travels at least a mile, some more than two; bullets penetrate interior walls.','Malfunction: stop firing, keep it pointed safely, wait 30 seconds, seek competent help. At a range, raise your non-shooting hand.','Semi-auto: remove the magazine FIRST, lock the slide back, check the chamber. Revolver (double-action): open the cylinder. Single-action revolver: open the loading gate.','A safety is not foolproof. Spinning a cylinder to an empty chamber does not unload a revolver.','Safe handling demonstrations are covered here but are not on the written test.']],

var QZ=null; // active quiz session
function fscState(){ ST.fsc=ST.fsc||{q:{},exams:[]}; ST.fsc.q=ST.fsc.q||{}; ST.fsc.exams=ST.fsc.exams||[]; return ST.fsc; }
function quietSave(){ ST.updatedAt=Date.now(); LS.set('state',ST); if(remote){ setSync('saving','Saving…'); clearTimeout(saveT); saveT=setTimeout(flush,900);} }
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function mastered(id){const r=fscState().q[id];return r&&r[2]===1&&r[0]>=1;}

function startQuiz(mode,cat){
  const D=fscData(); let pool=D.Q;
  if(mode==='topic') pool=D.Q.filter(q=>q[1]===cat);
  if(mode==='weak') pool=D.Q.filter(q=>{const r=fscState().q[q[0]];return r&&(r[2]===0||r[1]>r[0]);});
  if(mode==='new') pool=D.Q.filter(q=>!fscState().q[q[0]]);
  if(mode==='doj') pool=D.Q.filter(q=>q[6]===1);
  if(!pool.length){toast(mode==='weak'?'No weak spots yet. Take a practice round first.':'Nothing left in that set.');return;}
  let qs;
  if(mode==='exam'){ // balanced 30 across categories
    const by={};D.Q.forEach(q=>(by[q[1]]=by[q[1]]||[]).push(q));
    const keys=Object.keys(by); qs=[]; const sh=Object.fromEntries(keys.map(k=>[k,shuffle(by[k])]));
    let i=0; while(qs.length<30){const k=keys[i%keys.length]; if(sh[k].length) qs.push(sh[k].pop()); i++;}
    qs=shuffle(qs);
  } else qs=shuffle(pool).slice(0,mode==='topic'?15:mode==='doj'?pool.length:10);
  qs=qs.map(q=>{ if(q[3].length<3||q[3].some(o=>/^All of the above/.test(o))) return q; const order=shuffle(q[3].map((_,i)=>i)); return [q[0],q[1],q[2],order.map(i=>q[3][i]),order.indexOf(q[4]),q[5],q[6]]; });
  QZ={mode,cat,qs,i:0,ans:[],shown:false};
  renderFsc(); const el=document.getElementById('quiz'); if(el) el.scrollIntoView({block:'start'});
}
function answer(k){
  if(!QZ||QZ.shown&&QZ.mode!=='exam') return;
  const q=QZ.qs[QZ.i]; const ok=k===q[4]; QZ.ans[QZ.i]=k;
  const r=fscState().q[q[0]]||[0,0,0]; ok?r[0]++:r[1]++; r[2]=ok?1:0; fscState().q[q[0]]=r; quietSave();
  if(QZ.mode==='exam'){ next(); } else { QZ.shown=true; renderFsc(); }
}
function next(){ QZ.i++; QZ.shown=false; if(QZ.i>=QZ.qs.length){ finishQuiz(); } else renderFsc(); }
function finishQuiz(){
  const score=QZ.qs.filter((q,i)=>QZ.ans[i]===q[4]).length;
  if(QZ.mode==='exam'){ fscState().exams.push({d:TODAY,s:score,n:QZ.qs.length}); quietSave(); }
  QZ.done=true; renderFsc();
}

function renderFsc(){
  const v=document.getElementById('v-fsc'); const D=fscData(); const F=fscState();
  const seen=D.Q.filter(q=>F.q[q[0]]).length, mast=D.Q.filter(q=>mastered(q[0])).length;
  const ex=F.exams.slice(-3); const best=F.exams.length?Math.max(...F.exams.map(e=>e.s)):null;
  const ready = ex.length>=2 && ex.slice(-2).every(e=>e.s>=27);
  const catStats=Object.keys(D.cats).map(k=>{const qs=D.Q.filter(q=>q[1]===k);const m=qs.filter(q=>mastered(q[0])).length;return {k,name:D.cats[k],n:qs.length,m};});
  let quiz='';
  if(QZ&&!QZ.done){
    const q=QZ.qs[QZ.i]; const sh=QZ.shown;
    quiz=`<section class="card" id="quiz"><div class="card-h"><h3>${QZ.mode==='exam'?'Mock exam':QZ.mode==='topic'?esc(D.cats[QZ.cat]):QZ.mode==='weak'?'Weak spots':QZ.mode==='doj'?'Official DOJ self-tests':'Practice'}</h3><span class="mini">Question ${QZ.i+1} of ${QZ.qs.length}</span></div>
      <div style="padding:14px 16px;display:flex;flex-direction:column;gap:12px">
        <span class="meter" style="margin:0"><i style="width:${QZ.i/QZ.qs.length*100}%"></i></span>
        <span class="eyebrow">${esc(D.cats[q[1]])}${q[3].length===2?' · True or false':''}${q[6]?' · <span style="color:var(--signal)">Official DOJ self-test</span>':''}</span>
        <div style="font-size:17px;font-weight:600;line-height:1.4">${esc(q[2])}</div>
        <div style="display:flex;flex-direction:column;gap:8px">${q[3].map((o,k)=>{let st='';if(sh){if(k===q[4])st='border-color:var(--ok);background:var(--ok-soft);color:var(--ok)';else if(k===QZ.ans[QZ.i])st='border-color:var(--no);background:var(--no-soft);color:var(--no)';}
          return `<button class="btn qopt" data-k="${k}" style="text-align:left;padding:11px 14px;font-size:15px;${st}" ${sh?'disabled':''}><span class="mini" style="margin-right:8px">${'ABCD'[k]}</span>${esc(o)}</button>`}).join('')}</div>
        ${sh?`<div class="callout ${QZ.ans[QZ.i]===q[4]?'':'hot'}"><span class="eyebrow">${QZ.ans[QZ.i]===q[4]?'Correct':'Not quite'}</span><p>${esc(q[5])}</p></div><button class="btn pri" id="qnext" style="align-self:flex-start">${QZ.i+1<QZ.qs.length?'Next question':'See results'}</button>`:''}
        <button class="btn" id="qquit" style="align-self:flex-start;font-size:12px">Quit this round</button>
      </div></section>`;
  } else if(QZ&&QZ.done){
    const score=QZ.qs.filter((q,i)=>QZ.ans[i]===q[4]).length; const n=QZ.qs.length; const pass=QZ.mode==='exam'?score>=23:score/n>=.77;
    const wrong=QZ.qs.map((q,i)=>[q,QZ.ans[i]]).filter(x=>x[1]!==x[0][4]);
    quiz=`<section class="card" id="quiz"><div class="card-h"><h3>${QZ.mode==='exam'?'Mock exam result':'Round result'}</h3><span class="pill ${pass?'p-ok':'p-no'}">${pass?'Pass':'Not yet'}</span></div>
      <div style="padding:14px 16px;display:flex;flex-direction:column;gap:12px">
        <div style="font-family:var(--f-display);font-weight:800;font-size:54px;line-height:1">${score}<span class="mini" style="font-size:18px"> / ${n}</span></div>
        <p class="lead" style="font-size:14.5px">${QZ.mode==='exam'?(score>=27?'Test-ready score. Two in a row at 27 or better and you\'re ready to book.':score>=23?'That passes the real test. Aim for 27+ so a bad day still passes.':'The real test needs 23. Drill your weak spots, then take another mock.'):'Missed questions go into Weak spots automatically.'}</p>
        ${wrong.length?`<span class="eyebrow">Review what you missed</span>${wrong.map(([q,a])=>`<div class="zone" style="border:1px solid var(--line);border-radius:10px"><span class="zone-name">${esc(q[2])}</span><span></span><span class="zone-note"><span style="color:var(--no)">Your answer: ${a==null?'—':esc(q[3][a])}</span><br><span style="color:var(--ok)">Correct: ${esc(q[3][q[4]])}</span><br>${esc(q[5])}</span></div>`).join('')}`:''}
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" data-start="exam">New mock exam</button>${wrong.length?'<button class="btn" data-start="weak">Drill weak spots</button>':''}<button class="btn" id="qclose">Close</button></div>
      </div></section>`;
  }
  v.innerHTML = `
  <div class="hero" style="min-height:220px">${imgTag('papers','Application forms and a certificate on a desk')}
    <div class="hero-in"><span class="eyebrow">Firearm Safety Certificate · ${D.Q.length} questions · built from the 2025 DOJ study guide</span><h1 style="font-size:clamp(34px,6vw,54px)">Pass the FSC on the first try</h1>
    <p>Study the seven topics, memorize the numbers, drill by topic, then take 30-question mock exams until you score 27 or better twice in a row.</p></div></div>
  <div class="stats">
    <div class="stat"><span class="eyebrow">Readiness</span><span class="v" style="color:${ready?'var(--ok)':'inherit'}">${ready?'Ready':Math.round(mast/D.Q.length*100)+'%'}</span><span class="s">${ready?'Last two mocks 27+':'of questions mastered'}</span></div>
    <div class="stat"><span class="eyebrow">Best mock</span><span class="v">${best==null?'—':best+'/30'}</span><span class="s">${F.exams.length} mock exam${F.exams.length===1?'':'s'} taken</span></div>
    <div class="stat"><span class="eyebrow">Seen</span><span class="v">${seen}<span class="mini"> / ${D.Q.length}</span></span><span class="s">questions answered at least once</span></div>
    <div class="stat"><span class="eyebrow">Real test</span><span class="v">23 / 30</span><span class="s">$25 · at the dealer · valid 5 years</span></div>
  </div>
  ${quiz}
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn pri" data-start="exam">Take a 30-question mock exam</button>
    <button class="btn" data-start="practice">Quick 10</button>
    <button class="btn" data-start="new">Unseen questions</button>
    <button class="btn" data-start="doj">Official DOJ self-tests (${D.Q.filter(q=>q[6]===1).length})</button>
    <button class="btn" data-start="weak">Weak spots</button>
  </div>
  ${F.exams.length?`<div class="bars" aria-label="Mock exam history"><span class="eyebrow">Mock exam history (pass line 23, target 27)</span>${F.exams.slice(-8).map(e=>`<div class="bar-row"><span class="lab">${fmtD(e.d)}</span><span class="trk"><span class="rng" style="left:${23/30*100}%;width:.4%;background:var(--ink)"></span><span class="spent" style="width:${e.s/30*100}%;background:${e.s>=27?'var(--ok)':e.s>=23?'var(--olive)':'var(--no)'}"></span></span><span class="num">${e.s}/30</span></div>`).join('')}</div>`:''}
  <h2 class="sec">Key numbers to memorize</h2>
  <div class="stats" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">${D.nums.map(n=>`<div class="stat"><span class="v" style="font-size:24px">${esc(n[0])}</span><span class="s">${esc(n[1])}</span></div>`).join('')}</div>
  <h2 class="sec">Study by topic</h2>
  <div class="view" style="gap:10px">${D.chapters.map(c=>{const s=catStats.find(x=>x.k===c[0]);return `<div class="acc"><button class="acc-h" aria-expanded="false"><span>${esc(c[1])}</span><span style="display:flex;gap:8px;align-items:center"><span class="mini">${s.m}/${s.n} mastered</span>${chev}</span></button>
    <div class="acc-b" hidden><p style="color:var(--muted)">${esc(c[2])}</p><ul>${c[3].map(b=>`<li>${esc(b)}</li>`).join('')}</ul><div><button class="btn pri" data-start="topic" data-cat="${c[0]}">Drill ${s.n} ${esc(c[1].toLowerCase())} questions</button></div></div></div>`}).join('')}</div>
  <h2 class="sec">On test day</h2>
  <div class="callout"><p>At WBT (or any dealer), the test is 30 multiple-choice and true/false questions. Bring your ID. If you miss, you can retake after 24 hours; ask the dealer whether the $25 covers the retake, since practice varies. Read every word: "always" and "never" answers are usually about the safety rules, and law questions turn on exact numbers.</p></div>
  <p class="foot">Built from the California DOJ <a href="https://oag.ca.gov/system/files/media/fsc-study-guide.pdf" target="_blank" rel="noopener">Firearm Safety Certificate Study Guide (2025)</a>, the source the test is written from. Questions marked Official DOJ self-test are the guide's own end-of-chapter questions; the rest are written from the guide's text, with page numbers in each explanation. Safe handling demonstration steps are in the guide but not on the written test.</p>`;
  v.querySelectorAll('[data-start]').forEach(b=>b.addEventListener('click',()=>startQuiz(b.dataset.start,b.dataset.cat)));
  v.querySelectorAll('.qopt').forEach(b=>b.addEventListener('click',()=>answer(+b.dataset.k)));
  const nx=v.querySelector('#qnext'); if(nx) nx.addEventListener('click',next);
  const qq=v.querySelector('#qquit'); if(qq) qq.addEventListener('click',()=>{QZ=null;renderFsc();});
  const qc=v.querySelector('#qclose'); if(qc) qc.addEventListener('click',()=>{QZ=null;renderFsc();});
  v.querySelectorAll('.acc-h').forEach(b=>b.addEventListener('click',()=>{const a=b.parentElement;const o=!a.classList.contains('open');a.classList.toggle('open',o);b.setAttribute('aria-expanded',o);a.querySelector('.acc-b').hidden=!o;}));
}
</script>
